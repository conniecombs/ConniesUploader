name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include app, OS, source/build, service, and toolchain details if relevant.
      value: |
        - OS:
        - App Version:
        - Run Type:
        - Python Version:
        - Go Version:
        - Build Command Used:
        - Upload Service:
        - Account Type:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant output from View > Execution Log, the terminal, crash_log.log, or scripts/diagnostics/check_sidecar_location.py.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots or screen recordings if they help explain the problem.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      placeholder: Add any other useful context here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have read the contributing guidelines.
          required: true
        - label: I have included relevant logs, screenshots, or reproduction details where applicable.
          required: true
