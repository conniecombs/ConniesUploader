name: Dependabot auto-merge
on:
  workflow_run:
    workflows: ['CI - Build and Test', 'Security Scanning']
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  dependabot:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge eligible updates only after complete validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/maintenance/merge_dependabot.py
