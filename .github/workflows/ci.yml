name: CI - Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, claude/**, codex/**, connie/** ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  go-build:
    name: Build Go Sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.26.x']

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache-dependency-path: backend/go.sum

    - run: go mod download
      working-directory: backend
    - run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
      working-directory: backend

    - run: go mod verify
      working-directory: backend
    - run: go vet ./...
      working-directory: backend
    - run: go test -v -coverprofile coverage.out ./...
      working-directory: backend
    - run: go tool cover -func coverage.out | tail -1
      working-directory: backend
      shell: bash
    - run: go build -v -ldflags="-s -w" -o uploader${{ runner.os == 'Windows' && '.exe' || '' }} .
      working-directory: backend

  python-build:
    name: Build Python Application
    runs-on: ${{ matrix.os }}
    needs: go-build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: frontend/requirements.txt

    - run: |
        python -m pip install --upgrade pip
        pip install -r frontend/requirements.txt

    - run: pytest tests/ -v --tb=short
      working-directory: frontend

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: backend/go.sum
    - name: Install Go vulnerability scanner
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - name: Scan Go dependencies
      run: govulncheck ./...
      working-directory: backend

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: frontend/requirements.txt

    - run: python -m pip install pip-audit==2.10.1
    - run: pip-audit -r frontend/requirements.txt

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Test automated repair policy
      run: python -m unittest discover -s scripts/maintenance/tests -v
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: backend/go.sum

    - name: Build golangci-lint v2 with workflow Go toolchain
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m
      working-directory: backend

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: frontend/requirements.txt

    - run: python -m pip install flake8==7.4.1 black==26.10.1
    - run: flake8 main.py modules/ --max-line-length=120 --ignore=E203,E501,W503 --exclude=__pycache__
      working-directory: frontend
    - run: black --check .
      working-directory: frontend

  package-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: python -m pip install -r frontend/requirements.txt
      - run: python scripts/maintenance/package_app.py

  package-macos:
    name: Build macOS Release
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: python -m pip install -r frontend/requirements.txt
      - run: python scripts/maintenance/package_app.py

  package-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: python -m pip install -r frontend/requirements.txt
      - run: python scripts/maintenance/package_app.py
