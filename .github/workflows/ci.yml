name: CI - Build and Test

on:
  push:
    branches: [ main, master, develop, claude/**, codex/** ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  go-build:
    name: Build Go Sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - run: go mod download
    - run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - run: go mod verify
    - run: go vet ./...
    - run: go test -short -v -timeout=5m -coverprofile coverage.out ./...
    - run: go tool cover -func coverage.out
    - run: go build -v -ldflags="-s -w" -o uploader${{ runner.os == 'Windows' && '.exe' || '' }} .

  python-build:
    name: Build Python Application
    runs-on: ${{ matrix.os }}
    needs: go-build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - run: pytest tests/ -v --tb=short

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: pip install pip-audit
    - run: pip-audit -r requirements.txt

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build golangci-lint v2 with workflow Go toolchain
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

    - name: Run golangci-lint
      run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: pip install flake8
    - run: flake8 main.py modules/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__
